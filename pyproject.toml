[project]
name = "code-role"
version = "0.1.0"
description = "Local document-based role workflow template for controlling Codex-assisted software delivery."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "Proprietary" }

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
